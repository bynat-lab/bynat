name: Scheduled Quality

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.4

      - name: Lint
        run: ruff check bynat tests benchmarks

      - name: Install interrogate
        run: python -m pip install interrogate==1.7.0

      - name: Check docstring coverage
        run: interrogate -c pyproject.toml bynat

  scheduled-quality:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev and optional dependencies
        run: python -m pip install ".[dev,translation,geocoding,currency,categorization,nlp,sql]"

      - name: Run extended Hypothesis property tests
        run: python -m pytest -m property --hypothesis-profile=extended

      - name: Run slow concurrency suite
        run: python -m pytest -m slow

      - name: Run advisory Cosmic Ray mutation session
        continue-on-error: true
        run: |
          cosmic-ray init cosmic-ray.toml session.sqlite
          cosmic-ray exec cosmic-ray.toml session.sqlite
          cr-report session.sqlite > mutation_report.txt

      - name: Upload mutation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation_report.txt
