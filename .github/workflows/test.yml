name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.4

      - name: Lint
        run: ruff check bynat tests benchmarks

      - name: Install interrogate
        run: python -m pip install interrogate==1.7.0

      - name: Check docstring coverage
        run: interrogate -c pyproject.toml bynat

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and type-checking tools
        run: python -m pip install . mypy pandas-stubs pytest hypothesis

      - name: Type check
        run: python -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tooling
        run: python -m pip install . pytest pytest-cov hypothesis build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Compile package and tests
        run: python -m compileall -q bynat tests

      - name: Run test suite with branch coverage and wheel verification (Ubuntu 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m pytest --cov=bynat --cov-branch --cov-report=term-missing --cov-report=xml
          python tools/verify_installed_wheel.py

      - name: Run test suite (matrix leg)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: python -m pytest -q

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with all extras
        run: python -m pip install ".[translation,geocoding,currency,categorization,nlp,sql]" pytest hypothesis

      - name: Run optional-dependency tests
        run: python -m pytest -m extras -rs
