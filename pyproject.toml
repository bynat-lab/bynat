[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bynat"
version = "0.6.6"
description = "A Python toolkit for simplifying data workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
]
license = "MIT"
authors = [
    { name = "Abdallah Abukhalil" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
translation = [
    "deep-translator",
    "langdetect",
]
geocoding = [
    "geopy",
]
currency = [
    "Babel",
    "pycountry",
    "yfinance",
]
categorization = [
    "pyahocorasick",
]
nlp = [
    "spacy",
]
sql = [
    "SQLAlchemy",
]
dev = [
    "cosmic-ray",
    "hypothesis",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Changelog = "https://github.com/bynat-lab/bynat/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["bynat*"]

[tool.setuptools.package-data]
bynat = ["py.typed"]
"bynat.cleaning" = ["*.pyi"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
files = [
    "bynat/caching/manager.py",
    "bynat/cleaning/_common.py",
    "bynat/cleaning/accessor.py",
    "bynat/cleaning/columns.py",
    "bynat/cleaning/enrich",
    "bynat/cleaning/io.py",
    "bynat/cleaning/profile.py",
    "bynat/cleaning/stats.py",
    "bynat/cleaning/text.py",
    "tests",
]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["bynat.cleaning.base", "bynat.caching.Caching", "bynat.cleaning.Cleaning"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "ahocorasick",
    "babel.*",
    "deep_translator",
    "geopy.*",
    "hypothesis.*",
    "langdetect",
    "pycountry",
    "pytest.*",
    "spacy.*",
    "sqlalchemy",
    "yfinance",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tools.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not slow and not extras and not network and not mutation"]
strict_markers = true
strict_config = true
markers = [
    "unit: Tests one function or method in isolation",
    "integration: Cross-module, persistence, file I/O, or real optional-dependency behavior",
    "property: Hypothesis property-based test",
    "slow: Takes more than a few seconds",
    "extras: Requires an optional extra dependency",
    "mutation: Dedicated mutation-testing support test",
    "network: Reserved quarantine label; no supported bynat test may access live services",
]

[tool.coverage.run]
branch = true
source = ["bynat"]

[tool.coverage.report]
precision = 1
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

